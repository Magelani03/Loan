<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Status - LOAN</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #1a202c; color: #e2e8f0; font-family: Arial, sans-serif; }
    .header { background-color: #2d3748; }
    .card { background-color: #4a5568; border-radius: 10px; }
  </style>
</head>
<body>
  <header class="header p-4 flex justify-between items-center">
    <div class="flex items-center">
      <img src="https://via.placeholder.com/40" alt="Logo" class="mr-2">
      <span class="text-xl font-bold">LOAN</span>
      <span class="text-sm text-gray-400 ml-2">Financially Healthy</span>
    </div>
    <nav class="space-x-4">
      <a href="index.html" class="text-gray-300 hover:text-white">Home</a>
    </nav>
    <div class="space-x-4">
      <a href="#" class="text-gray-300 hover:text-white" onclick="logout()">Logout</a>
    </div>
  </header>

  <section class="py-10 text-center">
    <h1 class="text-3xl font-bold">Loan Status</h1>
    <div class="card p-6 w-1/2 mx-auto mt-4" id="loan-status-container">
      <p>Loading...</p>
    </div>
  </section>

  <script type="module">
    import { supabase } from './db.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) window.location.href = 'index.html';
      else loadLoanStatus(user.id);
    });

    async function loadLoanStatus(userId) {
      const { data, error } = await supabase
        .from('loan_applications')
        .select('*')
        .eq('user_id', userId)
        .order('date_applied', { ascending: false });

      const container = document.getElementById('loan-status-container');

      if (error) container.textContent = 'Error loading status';
      else if (data.length === 0) container.textContent = 'No loan applications found';
      else {
        container.innerHTML = data
          .map(loan => `
            <p>
              ${loan.loan_type || ''} 
              ${loan.amount ? `- $${loan.amount}` : ''} 
              ${loan.duration ? `(${loan.duration} months)` : ''} 
              - Status: ${loan.status}
            </p>
          `).join('');
      }
    }

    async function logout() {
      const { error } = await supabase.auth.signOut();
      if (error) alert(error.message);
      else window.location.href = 'index.html';
    }
  </script>
</body>
</html>
