<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Type - LOAN</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #1a202c; color: #e2e8f0; font-family: Arial, sans-serif; }
    .header { background-color: #2d3748; }
    .card { background-color: #4a5568; border-radius: 10px; }
    .btn { background-color: #718096; color: #fff; padding: 10px 20px; border-radius: 5px; }
    .btn:hover { background-color: #a0aec0; }
  </style>
</head>
<body>
  <header class="header p-4 flex justify-between items-center">
    <div class="flex items-center">
      <img src="https://via.placeholder.com/40" alt="Logo" class="mr-2">
      <span class="text-xl font-bold">LOAN</span>
      <span class="text-sm text-gray-400 ml-2">Financially Healthy</span>
    </div>
    <nav class="space-x-4">
      <a href="index.html" class="text-gray-300 hover:text-white">Home</a>
      <a href="#" class="text-gray-300 hover:text-white">About</a>
      <a href="#" class="text-gray-300 hover:text-white">Contact</a>
    </nav>
    <div class="space-x-4">
      <a href="#" class="text-gray-300 hover:text-white" onclick="logout()">Logout</a>
    </div>
  </header>

  <section class="py-10 text-center">
    <h1 class="text-3xl font-bold">Loan Type</h1>
    <div class="flex justify-center space-x-4 mt-4 w-3/4 mx-auto">
      <div class="card p-4 w-1/3">
        <h3 class="text-xl mb-2">1 Month Period</h3>
        <button class="btn w-full" onclick="applyLoan('1 Month Period')">Apply Now</button>
      </div>
      <div class="card p-4 w-1/3">
        <h3 class="text-xl mb-2">3 Month Period</h3>
        <button class="btn w-full" onclick="applyLoan('3 Month Period')">Apply Now</button>
      </div>
      <div class="card p-4 w-1/3">
        <h3 class="text-xl mb-2">5 Month Period</h3>
        <button class="btn w-full" onclick="applyLoan('5 Month Period')">Apply Now</button>
      </div>
    </div>
  </section>

  <script type="module">
    import { supabase } from './db.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) window.location.href = 'index.html';
    });

    async function applyLoan(loanType) {
      const { data: { user } } = await supabase.auth.getUser();
      const { error } = await supabase.from('loan_applications').insert({
        user_id: user.id,
        loan_type: loanType,
        status: 'Pending',
        date_applied: new Date().toISOString()
      });
      if (error) alert(error.message);
      else alert('Loan application submitted!');
    }

    async function logout() {
      const { error } = await supabase.auth.signOut();
      if (error) alert(error.message);
      else window.location.href = 'index.html';
    }
  </script>
</body>
</html>
