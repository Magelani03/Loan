<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LOAN</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <img src="user-icon.png" alt="User" class="auth-icon">
        <h1>Login</h1>
        <form id="login-form">
            <input type="email" placeholder="Email:" required>
            <input type="password" placeholder="Password:" required>
            <p><a href="reset-password.html">Forgot Password?</a></p>
            <p>Don't have Account? <a href="signup.html">Create Account</a></p>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>

    <script type="module">
  import { supabase } from './db.js';

  document.getElementById('signup-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = e.target[0].value;
    const surname = e.target[1].value;
    const email = e.target[2].value;
    const password = e.target[3].value;

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: { name, surname },
      },
    });

    if (error) alert(error.message);
    else alert('Check your email for confirmation!');
  });

  document.getElementById('login-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = e.target[0].value;
    const password = e.target[1].value;

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) alert(error.message);
    else window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
